[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-writer-addon"
version = "0.1.0"
description = "Drop-in Spec Builder Component 2b"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
spec-writer = "spec_writer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
