<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Show Me</title><style>
:root{--ink:#111827;--mut:#667085;--line:#e5e7eb;--card:#fff;--bg:#f8fafc;--acc:#111827;--bad:#fff7ed;--badline:#fed7aa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}.wrap{max-width:980px;margin:auto;padding:28px 22px 80px}header{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:70px}.hero{max-width:760px;margin:0 auto}.hero h1{font-size:48px;line-height:1.05;margin:0 0 14px}.hero p{color:var(--mut);font-size:18px;margin:0 0 28px}textarea{width:100%;border:2px solid var(--line);border-radius:18px;padding:18px;font:inherit;resize:vertical;min-height:150px;background:white;outline:none}textarea:focus{border-color:#98a2b3}.btn{border:0;border-radius:12px;padding:13px 22px;font:inherit;font-weight:650;cursor:pointer}.primary{background:var(--acc);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}.row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}.cards{display:grid;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.card.on{border:2px solid var(--ink)}.card h3{margin:0 0 4px}.small{color:var(--mut);font-size:14px}.flag{background:var(--bad);border:1px solid var(--badline);border-radius:14px;padding:16px;margin-bottom:16px}.flag b{display:block}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 13px;cursor:pointer}.pill.on{background:#111827;color:#fff}.iframe{width:100%;height:650px;border:1px solid var(--line);border-radius:18px;background:#fff}.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.looks button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px;text-align:left}.looks button.on{border-color:#111827}.looks img{width:100%;display:block;border-radius:8px}.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:16px;border-radius:14px}.spinner{padding:40px;text-align:center;color:var(--mut)}@media(max-width:700px){.hero h1{font-size:36px}.looks{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header><b>SHOW ME</b><span id="status"></span></header><main class="hero" id="app"></main></div><script>
let proposal=null,built=null,lookIndex=0,selectedLook=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PILL_ITEMS={who:'/api/who',density:'/api/density',mark:'/api/mark'};
function home(){ $('#app').innerHTML='<h1>What are you building?</h1><p>Describe it in your own words. I will show you what I think you mean before anything is committed.</p><textarea id="text" autofocus placeholder="e.g. I need something to manage customers, deals and the people we speak to..."></textarea><div class="row"><button class="btn primary" id="go">Show me</button></div>';$('#go').onclick=match }
async function match(){let text=$('#text').value.trim();if(!text)return;$('#app').innerHTML='<div class="spinner">Working out what is actually on the shelf…</div>';proposal=await(await fetch('/api/match',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})})).json();renderProposal()}
function renderProposal(){if(proposal.not_on_shelf.length) {let flags=proposal.not_on_shelf.map(g=>`<div class="flag"><b>${esc(g.plain)}</b><div>${esc(g.why)}</div><div>${esc(g.instead)}</div></div>`).join(''); if(!proposal.matches.length){$('#app').innerHTML='<h1>That part is not on the shelf.</h1>'+flags+'<button class="btn ghost" onclick="home()">Try another description</button>';return;} }
let flags=(proposal.not_on_shelf||[]).map(g=>`<div class="flag"><b>${esc(g.plain)} — not on the shelf.</b><div>${esc(g.instead)}</div></div>`).join('');let matches=proposal.matches.map(c=>`<div class="card on"><h3>${esc(c.name)}</h3><div>${esc(c.one_line)}</div><div class="small">Match ${c.score} · ${esc(c.hits.join(', '))}</div></div>`).join('');
let open=proposal.open_items.map(o=>PILL_ITEMS[o.id]?`<div class="card"><h3>${esc(o.label)}</h3><div class="small">${esc(o.help)}</div><div class="pills" id="${o.id}"></div></div>`:o.id==='boss'?`<div class="card"><h3>Who is in charge?</h3><div class="small">This cannot be guessed.</div><input id="boss" placeholder="e.g. Owner" style="width:100%;margin-top:12px;padding:12px;border:1px solid #ddd;border-radius:10px"></div>`:`<div class="card"><h3>Anything it must NOT do?</h3><div class="small">Say “nothing” if there are no exclusions.</div><textarea id="must_not" rows="3" placeholder="Anything explicitly excluded"></textarea></div>`).join('');
$('#app').innerHTML=flags+'<h1>Here is what I think you mean.</h1><p>These are existing catalogue capabilities. I will not invent another one.</p><div class="cards">'+matches+open+'</div><div class="row"><button class="btn ghost" onclick="home()">Change</button><button class="btn primary" id="build">Build a version</button></div>';for(const id of proposal.open_items.map(o=>o.id))if(PILL_ITEMS[id])loadPills(id);$('#build').onclick=build}
async function loadPills(id){let r=await(await fetch(PILL_ITEMS[id])).json();$('#'+id).innerHTML=r.options.map(o=>`<button class="pill" data-v="${esc(o.value)}"><b>${esc(o.label)}</b></button>`).join('');$('#'+id).querySelectorAll('.pill').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' .pill').forEach(x=>x.classList.remove('on'));b.classList.add('on')})}
async function build(){let need={};for(const id of ['who','density','mark']){if(!$('#'+id))continue;let p=document.querySelector('#'+id+' .on');if(!p){alert(id+' is required.');return}need[id]=p.dataset.v}let mustNot=$('#must_not')?.value;if(mustNot===undefined||mustNot===null||mustNot.trim()===''){alert("Say what it must NOT do, or type 'nothing'.");return}let boss=$('#boss')?.value||null;let body={does:proposal.text,cards:proposal.matches.map(x=>x.id),who:need.who,density:need.density,mark:need.mark,boss,name:proposal.matches[0].name,must_not:mustNot};$('#app').innerHTML='<div class="spinner">Building a real provisional app…</div>';built=await(await fetch('/api/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();if(built.error){$('#app').innerHTML='<h1>It stopped, and said why.</h1><div class="err">'+esc(built.error)+'</div><button class="btn ghost" onclick="renderProposal()">Back</button>';return}showBuilt()}
function showBuilt(){lookIndex=0;selectedLook=null;let url=built.looks[0];$('#app').innerHTML='<h1>Show me.</h1><p>The app is real and running. Try the three looks below. Nothing is locked yet.</p><iframe class="iframe" id="frame" src="'+url+'"></iframe><div class="row"><button class="btn ghost" id="change">Change something</button><button class="btn ghost" id="another">Show me another version</button><button class="btn primary" id="right">Looks right</button></div>';$('#another').onclick=()=>{lookIndex=(lookIndex+1)%3;$('#frame').src=built.looks[lookIndex]};$('#change').onclick=renderProposal;$('#right').onclick=lock}
async function lock(){let choices=['console','board','pocket'];selectedLook=choices[lookIndex];let r=await(await fetch('/api/lock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({look:selectedLook,out:built.out})})).json();if(r.error){$('#app').insertAdjacentHTML('afterbegin','<div class="err">'+esc(r.error)+'</div>');return}$('#app').innerHTML='<h1>Locked.</h1><p>IFC-001.chosen = <b>'+esc(selectedLook)+'</b>. The provisional app is ready to hand to the normal build chain.</p><iframe class="iframe" src="'+built.looks[lookIndex]+'"></iframe>'}
home();
</script></body></html>
