<!doctype html>
<title>Organisations</title>
<style>body{font-family:system-ui,sans-serif;max-width:800px;margin:40px auto}
table{border-collapse:collapse;width:100%} td,th{border:1px solid #ccc;padding:6px}body{margin:0}.app-header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #ddd;font-family:system-ui,sans-serif}.app-mark{width:28px;height:28px}.app-name{font-weight:600}</style>
<header class="app-header"><svg class="app-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <circle cx="32" cy="32" r="24" fill="none" stroke="#4C4A9E" stroke-width="4"/>
  <circle cx="32" cy="32" r="6" fill="#4C4A9E"/>
</svg>
<span class="app-name">Connector (Orbit mark)</span></header><h1>Organisations</h1>
<div id="state">Loading…</div>
<table id="rows" hidden><thead><tr><th>Name</th><th>Website</th><th>Phone</th><th>Notes</th></tr></thead><tbody></tbody></table>
<script>
const FIELD_KEYS = ["name", "website", "phone", "notes"];
async function load() {
  const state = document.getElementById('state');
  const table = document.getElementById('rows');
  try {
    const res = await fetch('/api/organisations');
    if (!res.ok) throw new Error('bad status');
    const rows = await res.json();
    if (!rows.length) { state.textContent = 'No organisations yet.'; return; }
    const body = table.querySelector('tbody');
    for (const r of rows) {
      const tr = document.createElement('tr');
      for (const key of FIELD_KEYS) {
        const td = document.createElement('td');
        td.textContent = r[key] ?? '';
        tr.appendChild(td);
      }
      body.appendChild(tr);
    }
    state.hidden = true; table.hidden = false;
  } catch (e) {
    state.textContent = 'Cannot reach server';
  }
}
load();
</script>
