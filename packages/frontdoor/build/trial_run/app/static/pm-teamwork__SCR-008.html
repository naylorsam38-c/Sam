<!doctype html><html><head><meta charset='utf-8'><title>Overdue tasks</title></head><body><header class="app-header"><svg class="app-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">

</svg>
<span class="app-name">Teamwork Desk (Grid mark)</span></header><h1>Overdue tasks</h1><table id='numbers'></table><script>fetch('/api/reports/overdue_tasks').then(r => r.json()).then(d => {document.getElementById('numbers').innerHTML = Object.entries(d).map(([metric, value]) => '<tr><td>' + metric + '</td><td class=\'value\'>' + JSON.stringify(value) + '</td></tr>').join('');});</script></body></html>
