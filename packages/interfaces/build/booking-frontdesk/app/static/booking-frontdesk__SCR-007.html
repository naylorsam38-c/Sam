<!doctype html><html><head><meta charset='utf-8'><title>Public booking form</title></head><body><form method="post" action="/api/forms/public_booking_form" data-record="Appointment">
<header class="app-header"><span class="app-name">Front Desk</span></header><h1>Appointment</h1>
<label for="service">Service</label>
<select id="service" name="service" required></select>
<label for="customer">Customer</label>
<select id="customer" name="customer" required></select>
<label for="staff_member">Staff member</label>
<input id="staff_member" name="staff_member" type="text" required>
<label for="start">Start</label>
<input id="start" name="start" type="datetime-local" required>
<label for="notes">Notes</label>
<textarea id="notes" name="notes"></textarea>
<label for="deposit_paid">Deposit paid</label>
<input id="deposit_paid" name="deposit_paid" type="checkbox">
<button type="submit">Save</button></form><p id='result'></p><script>const LINKS = {"service": "services", "customer": "customers"};Object.entries(LINKS).forEach(async ([field, table]) => {const res = await fetch('/api/' + table); const rows = await res.json();const sel = document.getElementById(field);sel.innerHTML = rows.map(r => '<option value="' + r.id + '">' +((r.name || r.topic || r.service || r.id)) + '</option>').join('');});</script><script>document.querySelector('form').addEventListener('submit', async e => {e.preventDefault();const data = Object.fromEntries(new FormData(e.target).entries());const r = await fetch(e.target.action, {method:'POST',headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)});const out = await r.json();document.getElementById('result').textContent = r.ok ? ('saved ' + out.id) : out.error;});</script></body></html>
