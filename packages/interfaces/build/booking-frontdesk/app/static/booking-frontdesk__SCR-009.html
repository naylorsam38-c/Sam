<!doctype html><html><head><meta charset='utf-8'><title>No-show rate</title></head><body><header class="app-header"><span class="app-name">Front Desk</span></header><h1>No-show rate</h1><table id='numbers'></table><script>fetch('/api/reports/no_show_rate').then(r => r.json()).then(d => {document.getElementById('numbers').innerHTML = Object.entries(d).map(([metric, value]) => '<tr><td>' + metric + '</td><td class=\'value\'>' + JSON.stringify(value) + '</td></tr>').join('');});</script></body></html>
