<!doctype html><html><head><meta charset='utf-8'><title>Pipeline by stage</title></head><body><header class="app-header"><span class="app-name">Pipeline</span></header><h1>Pipeline by stage</h1><table id='numbers'></table><script>fetch('/api/reports/pipeline_by_stage').then(r => r.json()).then(d => {document.getElementById('numbers').innerHTML = Object.entries(d).map(([metric, value]) => '<tr><td>' + metric + '</td><td class=\'value\'>' + JSON.stringify(value) + '</td></tr>').join('');});</script></body></html>
