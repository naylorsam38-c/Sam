<!doctype html><html><head><meta charset='utf-8'><title>Sales by month</title></head><body><header class="app-header"><span class="app-name">Backbone</span></header><h1>Sales by month</h1><table id='numbers'></table><script>fetch('/api/reports/sales_by_month').then(r => r.json()).then(d => {document.getElementById('numbers').innerHTML = Object.entries(d).map(([metric, value]) => '<tr><td>' + metric + '</td><td class=\'value\'>' + JSON.stringify(value) + '</td></tr>').join('');});</script></body></html>
