<!doctype html><html><head><meta charset='utf-8'><title>Open tasks by person</title></head><body><header class="app-header"><span class="app-name">Teamwork</span></header><h1>Open tasks by person</h1><table id='numbers'></table><script>fetch('/api/reports/open_tasks_by_person').then(r => r.json()).then(d => {document.getElementById('numbers').innerHTML = Object.entries(d).map(([metric, value]) => '<tr><td>' + metric + '</td><td class=\'value\'>' + JSON.stringify(value) + '</td></tr>').join('');});</script></body></html>
